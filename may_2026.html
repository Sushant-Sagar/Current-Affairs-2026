const quizBox = document.getElementById("quiz-box");

function renderQuiz() {
    // Page refresh/load पर पूरा quiz fresh state में शुरू होगा।
    quizBox.innerHTML = "";

    quizData.forEach(function(item, qIndex) {
        const qCard = document.createElement("div");
        qCard.className = "question-card";

        const qTitle = document.createElement("div");
        qTitle.className = "question-title";
        qTitle.textContent = (qIndex + 1) + ". " + item.q;
        qCard.appendChild(qTitle);

        const optionsGrid = document.createElement("div");
        optionsGrid.className = "options-grid";

        item.options.forEach(function(option, optIndex) {
            const button = document.createElement("button");
            button.type = "button";
            button.className = "option-btn";
            button.textContent =
                String.fromCharCode(65 + optIndex) + ". " + option;

            button.addEventListener("click", function() {
                checkAnswer(
                    qIndex,
                    optIndex,
                    optionsGrid,
                    explanation
                );
            });

            optionsGrid.appendChild(button);
        });

        qCard.appendChild(optionsGrid);

        const explanation = document.createElement("div");
        explanation.className = "explanation";
        explanation.innerHTML =
            "<strong>व्याख्या:</strong> " +
            (item.explanation || "व्याख्या उपलब्ध नहीं है।");

        qCard.appendChild(explanation);
        quizBox.appendChild(qCard);
    });
}

function checkAnswer(qIndex, selectedIndex, optionsGrid, explanation) {
    const buttons = optionsGrid.querySelectorAll(".option-btn");
    const correctIndex = quizData[qIndex].ans;

    // सभी options disable करें।
    buttons.forEach(function(button) {
        button.disabled = true;
    });

    // सही answer हरा दिखाएँ।
    if (buttons[correctIndex]) {
        buttons[correctIndex].classList.add("correct");
    }

    // चुना गया answer गलत हो तो लाल दिखाएँ।
    if (selectedIndex !== correctIndex && buttons[selectedIndex]) {
        buttons[selectedIndex].classList.add("incorrect");
    }

    // Explanation तुरंत दिखाएँ।
    explanation.classList.add("show");
}


function shuffleQuestionOptions(question) {
    const combined = question.options.map(function(option, index) {
        return {
            text: option,
            isCorrect: index === question.ans
        };
    });

    // Fisher-Yates shuffle
    for (let i = combined.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = combined[i];
        combined[i] = combined[j];
        combined[j] = temp;
    }

    question.options = combined.map(function(item) {
        return item.text;
    });

    question.ans = combined.findIndex(function(item) {
        return item.isCorrect;
    });
}

quizData.forEach(shuffleQuestionOptions);

renderQuiz();
</script>
